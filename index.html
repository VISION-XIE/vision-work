  function refreshCompensatorySourceOptions(excludeCpId, currentValue) {
    const sel = document.getElementById('compensatory-source');
    const cur = currentValue || sel.value || 'fifo';
    sel.innerHTML = '<option value="fifo">自动 FIFO（按过期日跨类型扣减，推荐）</option>' +
      '<optgroup label="加班调休">' +
      getAllPools(excludeCpId)
        .filter(p => p.type === 'overtime' && p.availableMinutes > 0 && p.status !== 'expired')
        .sort((a, b) => (a.expiresAt - b.expiresAt))
        .map(p => '<option value="overtime:' + p.id + '">加班 ' + p.date + ' · 剩 ' + formatHours(p.availableMinutes) + 'h · 过期 ' + formatDate(new Date(p.expiresAt)) + '</option>')
        .join('') +
      '</optgroup>' +
      '<optgroup label="年假">' +
      getAllPools(excludeCpId)
        .filter(p => p.type === 'annual' && p.availableMinutes > 0 && p.status !== 'expired')
        .sort((a, b) => (a.expiresAt - b.expiresAt))
        .map(p => '<option value="annual:' + p.id + '">年假 ' + p.date + ' · 剩 ' + formatHours(p.availableMinutes) + 'h · 过期 ' + formatDate(new Date(p.expiresAt)) + '</option>')
        .join('') +
      '</optgroup>' +
      '<optgroup label="其他">' +
      getAllPools(excludeCpId)
        .filter(p => p.type === 'other' && p.availableMinutes > 0 && p.status !== 'expired')

        .map(p => '<option value="other:' + p.id + '">其他 ' + p.date + ' · 剩 ' + formatHours(p.availableMinutes) + 'h · 过期 ' + formatDate(new Date(p.expiresAt)) + '</option>')

    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;

  function closeCompensatoryModal() { document.getElementById('compensatory-modal').classList.add('hidden'); }
  function updateCompensatoryPreview() {
    const id = document.getElementById('compensatory-id').value;
    const hoursStr = document.getElementById('compensatory-hours').value;
    const source = document.getElementById('compensatory-source').value;
    const hours = parseFloat(hoursStr);
    const preview = document.getElementById('compensatory-preview');
    const byType = getAvailableByType(id);
    const totalAvail = byType.overtime + byType.annual + byType.other;
    const otH = formatHours(byType.overtime);
    const anH = formatHours(byType.annual);
    let summary = '当前可用 <strong>' + formatHours(totalAvail) + 'h</strong>（调休 ' + otH + 'h';
    if (byType.annual > 0) summary += ' · 年假 ' + anH + 'h';
    if (byType.other > 0) summary += ' · 其他 ' + formatHours(byType.other) + 'h';
    summary += '）';

    if (source === 'fifo') {
      if (isNaN(hours) || hours <= 0) { preview.innerHTML = summary; preview.className = 'form-preview'; return; }
      if (hours > totalAvail / 60) {
        preview.innerHTML = '申请 <strong>' + hours + 'h</strong> · ' + summary + ' · 余额不足';
        preview.className = 'form-preview error';
      } else {
        preview.innerHTML = '申请 <strong>' + hours + 'h</strong>（自动 FIFO 跨类型扣减） · ' + summary + ' · 余额充足';
        preview.className = 'form-preview';
      }
    } else {
      const [type, sid] = source.split(':');
      const pool = getAllPools(id).find(p => p.type === type && p.id === sid);
      if (!pool) { preview.innerHTML = summary + '<br>该来源已不可用，请重新选择'; preview.className = 'form-preview error'; return; }
      const poolH = pool.availableMinutes / 60;
      if (isNaN(hours) || hours <= 0) {
        preview.innerHTML = '从 ' + typeLabel(type) + ' ' + pool.date + ' 扣减（剩 ' + formatHours(pool.availableMinutes) + 'h） · ' + summary;
        preview.className = 'form-preview';
        return;
      }
      if (hours > poolH) {
        preview.innerHTML = '从 ' + typeLabel(type) + ' ' + pool.date + ' 扣减 <strong>' + hours + 'h</strong> · 该笔仅剩 <strong>' + formatHours(pool.availableMinutes) + 'h</strong> · 不足';
        preview.className = 'form-preview error';
      } else {
        preview.innerHTML = '从 ' + typeLabel(type) + ' ' + pool.date + ' 扣减 <strong>' + hours + 'h</strong> · 该笔剩 ' + formatHours(pool.availableMinutes) + 'h · 充足';
        preview.className = 'form-preview';
      }
    }
  }

  // ---------- Tab 切换 ----------
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  }

  // ---------- 账号系统（内置固定账号登录，数据按账号隔离） ----------
  const FIXED_USERS = [
    { name: '谢老师', account: 'xiechangyun' },
    { name: '王老师', account: 'wangjiahui' },
    { name: '马老师', account: 'mahui' },
    { name: '郭老师', account: 'guoruilin' }
  ];
  const FIXED_PASSWORD = '123456';
  const LEGACY_OWNER = 'xiechangyun';

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function genSalt() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function hashPassword(password, salt) {
    return await sha256Hex(salt + '::' + password);
  }
  async function verifyPassword(password, user) {
    return (await hashPassword(password, user.salt)) === user.hash;
  }

  // 确保内置账号存在（名称以固定列表为准），并把旧版本（口令版）全局数据迁移到谢老师账号
  async function ensureFixedUsersAndMigrate() {
    const users = loadUsers();
    const hasLegacy = Object.keys(LEGACY_KEYS).some(k => {
      try {
        const v = localStorage.getItem(LEGACY_KEYS[k]);
        return v && v !== '[]';
      } catch(e) { return false; }
    });
    let dirty = false;
    for (const fu of FIXED_USERS) {
      const existing = users.find(u => u.account === fu.account);
      if (existing) {
        if (existing.name !== fu.name) { existing.name = fu.name; dirty = true; }
      } else {
        const salt = genSalt();
        const hash = await hashPassword(FIXED_PASSWORD, salt);
        users.push({ name: fu.name, account: fu.account, salt, hash, createdAt: new Date().toISOString(), isFixed: true });
        dirty = true;
      }
    }
    if (dirty) saveUsers(users);
    if (hasLegacy) {
      for (const k of Object.keys(LEGACY_KEYS)) {
        try {
          const raw = localStorage.getItem(LEGACY_KEYS[k]);
          if (raw) localStorage.setItem(dataKey(LEGACY_OWNER, k), raw);
          localStorage.removeItem(LEGACY_KEYS[k]);
        } catch(e) {}
      }
    }
  }
  function currentUserName() {
    const u = findUser(getCurrentAccount());
    return u ? u.name : '';
  }
  function showAuthError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function showAuthOverlay() {
    document.getElementById('auth-overlay').classList.remove('hidden');
    const pb = document.getElementById('btn-punch');
    if (pb) pb.classList.add('hidden');
    const input = document.getElementById('auth-account');
    if (input) input.focus();
  }
  function hideAuthOverlay() {
    document.getElementById('auth-overlay').classList.add('hidden');
    const pb = document.getElementById('btn-punch');
    if (pb) pb.classList.remove('hidden');
    const u = document.getElementById('current-user');
    if (u) u.textContent = '👤 ' + currentUserName();
    renderAll();
    syncAfterLogin(getCurrentAccount());
  }
  async function handleAuthSubmit() {
    const accountEl = document.getElementById('auth-account');
    const passEl = document.getElementById('auth-password');
    const account = accountEl.value.trim();
    const password = passEl.value;
    const errorEl = document.getElementById('auth-error');
    errorEl.classList.add('hidden');
    if (!account) { showAuthError('请输入账号'); accountEl.focus(); return; }
    if (!password) { showAuthError('请输入密码'); passEl.focus(); return; }
    const user = findUser(account);
    if (!user) { showAuthError('账号不存在，请检查后重试'); accountEl.value = ''; passEl.value = ''; accountEl.focus(); return; }
    const ok = await verifyPassword(password, user);
    if (!ok) { showAuthError('密码错误，请重试'); passEl.value = ''; passEl.focus(); return; }
    setCurrentAccount(account);
    accountEl.value = ''; passEl.value = '';
    hideAuthOverlay();
  }
  function bindAuthEvents() {
    const submit = document.getElementById('auth-submit');
    ['auth-account', 'auth-password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submit.click(); }
      });
    });
    submit.addEventListener('click', handleAuthSubmit);
  }
  function logout() {
    clearSession();
    location.reload();
  }

  // ---------- 加班打卡 ----------
  let toastTimer = null;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    if (!el) { alert(msg); return; }
    el.textContent = msg;
    el.className = 'toast ' + (type || '');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function punchClock() {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const nowStr = nowTimeStr();
    const today = todayStr();
    if (nowMin < OT_START_MIN) {
      showToast('现在还没到 18:30，暂不能加班打卡', 'warn');
      return;
    }
    const rawMin = nowMin - OT_START_MIN;
    if (rawMin < MIN_VALID_MINUTES) {
      showToast('加班时长不足 30 分钟，暂不能打卡', 'warn');
      return;
    }
    const list = loadOvertime();
    const existing = list.find(o => o.date === today && o.punched);
    if (existing) {
      if (nowStr <= existing.end) {
        showToast('当前时间未超过已记录的下班时间 ' + existing.end + '，无需更新', 'warn');
        return;
      }
      existing.end = nowStr;
      existing.minutes = computeOvertimeMinutes(existing.start, nowStr);
      existing.punched = true;
      saveOvertime(list);
      showToast('打卡成功 · 今日加班更新至 ' + nowStr + '，共 ' + formatHours(existing.minutes) + ' 小时', 'success');
    } else {
      const minutes = computeOvertimeMinutes('18:30', nowStr);
      const ot = { id: uid(), date: today, start: '18:30', end: nowStr, minutes, note: '加班打卡', punched: true, createdAt: new Date().toISOString() };
      list.push(ot);
      saveOvertime(list);
      showToast('打卡成功 · 已记录今日加班 ' + formatHours(minutes) + ' 小时', 'success');
    }
    renderAll();
  }

  // ---------- 事件绑定 ----------
  function bindEvents() {
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

    document.getElementById('btn-add-overtime').addEventListener('click', () => openOvertimeModal());
    document.getElementById('btn-add-leave-quota').addEventListener('click', () => openLeaveQuotaModal());
    document.getElementById('btn-add-compensatory').addEventListener('click', () => openCompensatoryModal());
    document.getElementById('btn-export-overtime').addEventListener('click', exportOvertimeXls);
    document.getElementById('btn-export-pool').addEventListener('click', exportPoolXls);
    document.getElementById('btn-export-report').addEventListener('click', exportReport);
    document.getElementById('btn-export-data').addEventListener('click', exportDataJson);
    document.getElementById('btn-import-data').addEventListener('click', () => document.getElementById('data-file-input').click());
    document.getElementById('data-file-input').addEventListener('change', importDataJson);
    document.getElementById('btn-logout').addEventListener('click', logout);
    document.getElementById('btn-punch').addEventListener('click', punchClock);
    bindLeaveStatsEvents();

    document.getElementById('overtime-cancel').addEventListener('click', closeOvertimeModal);
    document.getElementById('overtime-submit').addEventListener('click', submitOvertime);
    ['overtime-date', 'overtime-start', 'overtime-end'].forEach(id => document.getElementById(id).addEventListener('input', updateOvertimePreview));

    document.getElementById('leave-quota-cancel').addEventListener('click', closeLeaveQuotaModal);
    document.getElementById('leave-quota-submit').addEventListener('click', submitLeaveQuota);
    ['leave-quota-type', 'leave-quota-date', 'leave-quota-hours', 'leave-quota-expires-at'].forEach(id => document.getElementById(id).addEventListener('input', updateLeaveQuotaPreview));

    document.getElementById('compensatory-cancel').addEventListener('click', closeCompensatoryModal);
    document.getElementById('compensatory-submit').addEventListener('click', submitCompensatory);
    ['compensatory-date', 'compensatory-hours', 'compensatory-note'].forEach(id => document.getElementById(id).addEventListener('input', updateCompensatoryPreview));
    document.getElementById('compensatory-source').addEventListener('change', updateCompensatoryPreview);
    document.getElementById('compensatory-hours').addEventListener('input', refreshCompensatorySourceOptions.bind(null, null));

    document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
    document.getElementById('confirm-ok').addEventListener('click', () => { const cb = confirmCallback; closeConfirm(); if (cb) cb(); });

    document.getElementById('overtime-table-wrap').addEventListener('click', e => {
      const t = e.target;
      if (t.dataset.editOt) openOvertimeModal(t.dataset.editOt);
      else if (t.dataset.delOt) confirmDeleteOvertime(t.dataset.delOt);
    });
    document.querySelectorAll('#ot-view-switch .switch-btn').forEach(b => {
      b.addEventListener('click', () => switchOvertimeView(b.dataset.otView));
    });
    document.getElementById('overtime-calendar-wrap').addEventListener('click', e => {
      if (e.target.id === 'cal-prev') { changeOtMonth(-1); return; }
      if (e.target.id === 'cal-next') { changeOtMonth(1); return; }
      if (e.target.id === 'cal-today') {
        const now = new Date();
        otCalYear = now.getFullYear();
        otCalMonth = now.getMonth();
        renderOvertimeCalendar();
        return;
      }
      const cell = e.target.closest('.cal-cell');
      if (!cell || cell.classList.contains('other-month')) return;
      const dateStr = cell.dataset.calDate;
      const count = parseInt(cell.dataset.calCount, 10);
      if (count === 0) {
        openOvertimeModal(null, dateStr);
      } else if (count === 1) {
        const rec = groupOvertimeByDate()[dateStr][0];
        openOvertimeModal(rec.id);
      }
    });
    document.getElementById('leave-quota-table-wrap').addEventListener('click', e => {
      const t = e.target;
      if (t.dataset.editLq) openLeaveQuotaModal(t.dataset.editLq);
      else if (t.dataset.delLq) confirmDeleteLeaveQuota(t.dataset.delLq);
    });
    document.getElementById('compensatory-table-wrap').addEventListener('click', e => {
      const t = e.target;
      if (t.dataset.editCp) openCompensatoryModal(t.dataset.editCp);
      else if (t.dataset.delCp) confirmDeleteCompensatory(t.dataset.delCp);
    });

    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); }));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.modal:not(.hidden)').forEach(m => m.classList.add('hidden'));
    });
  }

  // ---------- 风格模式切换（4 种风格） ----------
  const LS_KEY_THEME = 'vision-work:theme';
  const THEMES = [
    { id: 'tech', label: '科技炫酷' },
    { id: 'art', label: '文艺' },
    { id: 'minimal', label: '简约' },
    { id: 'vivid', label: '活力' }
  ];
  function getThemePref() {
    try {
      const t = localStorage.getItem(LS_KEY_THEME);
      return THEMES.some(x => x.id === t) ? t : 'minimal';
    } catch (e) { return 'minimal'; }
  }
  function currentThemeLabel() {
    const id = getThemePref();
    const found = THEMES.find(x => x.id === id);
    return found ? found.label : '简约';
  }
  function applyTheme(id) {
    if (!THEMES.some(x => x.id === id)) id = 'minimal';
    document.documentElement.setAttribute('data-theme', id);
    try { localStorage.setItem(LS_KEY_THEME, id); } catch (e) {}
    updateThemeUI();
  }
  function updateThemeUI() {
    const id = getThemePref();
    const b1 = document.getElementById('btn-theme-toggle');
    const b2 = document.getElementById('btn-auth-theme-toggle');
    if (b1) {
      const sp = b1.querySelector('span');
      if (sp) sp.textContent = currentThemeLabel();
    }
    if (b2) b2.textContent = '🎨';
    document.querySelectorAll('.theme-option').forEach(o => {
      o.classList.toggle('active', o.dataset.themeOpt === id);
    });
  }
  function openThemeMenu(anchor) {
    const menu = document.getElementById('theme-menu');
    if (!menu) return;
    const r = anchor.getBoundingClientRect();
    menu.classList.remove('hidden');
    const mw = menu.offsetWidth || 180;
    let left = Math.min(r.right - mw, window.innerWidth - mw - 12);
    left = Math.max(12, left);
    let top = r.bottom + 8;
    if (top + 240 > window.innerHeight) top = r.top - 246;
    menu.style.left = left + 'px';
    menu.style.top = Math.max(8, top) + 'px';
  }
  function closeThemeMenu() {
    const m = document.getElementById('theme-menu');
    if (m) m.classList.add('hidden');
  }
  function bindThemeEvents() {
    const b1 = document.getElementById('btn-theme-toggle');
    const b2 = document.getElementById('btn-auth-theme-toggle');
    const menu = document.getElementById('theme-menu');
    if (b1) b1.addEventListener('click', e => { e.stopPropagation(); if (menu.classList.contains('hidden')) openThemeMenu(b1); else closeThemeMenu(); });
    if (b2) b2.addEventListener('click', e => { e.stopPropagation(); if (menu.classList.contains('hidden')) openThemeMenu(b2); else closeThemeMenu(); });
    if (menu) {
      menu.addEventListener('click', e => {
        const opt = e.target.closest('.theme-option');
        if (opt) { applyTheme(opt.dataset.themeOpt); closeThemeMenu(); }
      });
    }
    document.addEventListener('click', e => {
      if (menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== b1 && e.target !== b2 && !b1.contains(e.target) && !b2.contains(e.target)) closeThemeMenu();
    });
  }

  // ---------- 初始化 ----------
  bindEvents();
  bindAuthEvents();
  bindThemeEvents();
  updateThemeUI();
  (async function init() {
    await ensureFixedUsersAndMigrate();
    const _initNow = new Date();
    otCalYear = _initNow.getFullYear();
    otCalMonth = _initNow.getMonth();
    switchOvertimeView(getOvertimeViewPref());
    if (getCurrentAccount() && findUser(getCurrentAccount())) {
      migrateData();
      hideAuthOverlay();
    } else {
      showAuthOverlay();
    }
  })();
})();
</script>
