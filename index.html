<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Work — 加班调休记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    --bg: #0e1219;
    --bg-grad-1: rgba(90, 141, 255, 0.10);
    --bg-grad-2: rgba(139, 92, 246, 0.10);
    --grid-line: rgba(148, 163, 184, 0.05);
    --card: #161d29;
    --card-2: #1b2432;
    --border: rgba(148, 163, 184, 0.14);
    --text: #e8edf5;
    --text-muted: #93a1b8;
    --primary: #5a8dff;
    --primary-strong: #3f6ef0;
    --primary-light: rgba(90, 141, 255, 0.15);
    --primary-glow: rgba(90, 141, 255, 0.35);
    --danger: #f87171;
    --danger-light: rgba(248, 113, 113, 0.13);
    --warning: #fbbf24;
    --warning-light: rgba(251, 191, 36, 0.13);
    --success: #34d399;
    --success-light: rgba(52, 211, 153, 0.13);
    --neutral: #94a3b8;
    --neutral-light: rgba(148, 163, 184, 0.12);
    --chart-track: rgba(148, 163, 184, 0.16);
    --grad-main: linear-gradient(135deg, #6ea8ff, #8b5cf6);
    --grad-btn: linear-gradient(135deg, #5a8dff, #7c5cf0);
    --overlay: rgba(5, 8, 14, 0.66);
    --auth-overlay-bg: rgba(10, 14, 26, 0.86);
    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.28);
    --shadow-pop: 0 24px 64px rgba(0, 0, 0, 0.5);
    --glow-soft: rgba(90, 141, 255, 0.18);
    --input-bg: rgba(148, 163, 184, 0.06);
    --row-hover: rgba(90, 141, 255, 0.07);
    --accent-text: #8ab4ff;
    --tooltip-bg: rgba(20, 27, 39, 0.98);
    --tooltip-text: #dbe4f0;
    --tooltip-sub: #9aa7bd;
    --ot-lv1: #fda4af;
    --ot-lv2: #fb7185;
    --ot-lv3: #f43f5e;
    --ot-lv4: #e11d48;
    --picker-invert: invert(1);
    --tab-hover: rgba(148, 163, 184, 0.08);
  }
  html[data-theme='light'] {
    color-scheme: light;
    --bg: #f3f5fa;
    --bg-grad-1: rgba(90, 141, 255, 0.09);
    --bg-grad-2: rgba(139, 92, 246, 0.08);
    --grid-line: rgba(15, 23, 42, 0.045);
    --card: #ffffff;
    --card-2: #f7f9fd;
    --border: rgba(15, 23, 42, 0.10);
    --text: #1d2533;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --primary-light: rgba(37, 99, 235, 0.10);
    --primary-glow: rgba(37, 99, 235, 0.28);
    --danger: #dc2626;
    --danger-light: rgba(220, 38, 38, 0.08);
    --warning: #d97706;
    --warning-light: rgba(217, 119, 6, 0.10);
    --success: #16a34a;
    --success-light: rgba(22, 163, 74, 0.10);
    --neutral: #64748b;
    --neutral-light: rgba(100, 116, 139, 0.10);
    --chart-track: rgba(15, 23, 42, 0.10);
    --grad-main: linear-gradient(135deg, #2563eb, #7c3aed);
    --grad-btn: linear-gradient(135deg, #3b82f6, #7c3aed);
    --overlay: rgba(15, 23, 42, 0.45);
    --auth-overlay-bg: rgba(243, 245, 250, 0.82);
    --shadow-card: 0 4px 20px rgba(15, 23, 42, 0.07);
    --shadow-pop: 0 20px 50px rgba(15, 23, 42, 0.18);
    --glow-soft: rgba(37, 99, 235, 0.12);
    --input-bg: #f8fafc;
    --row-hover: rgba(37, 99, 235, 0.05);
    --accent-text: #2563eb;
    --tooltip-bg: #ffffff;
    --tooltip-text: #334155;
    --tooltip-sub: #7c8aa0;
    --ot-lv1: #fb7185;
    --ot-lv2: #f43f5e;
    --ot-lv3: #e11d48;
    --ot-lv4: #be123c;
    --picker-invert: none;
    --tab-hover: rgba(15, 23, 42, 0.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 55% at 12% -8%, var(--bg-grad-1), transparent 60%),
      radial-gradient(ellipse 60% 45% at 95% -4%, var(--bg-grad-2), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
    padding: 28px 20px 72px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 92%);
    mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 92%);
    pointer-events: none;
    z-index: 0;
  }
  .app { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }
  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.22);
    border-radius: 6px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.38); background-clip: content-box; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Header ---------- */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 26px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: var(--grad-btn);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 17px; font-weight: 800;
    letter-spacing: -0.02em;
    box-shadow: 0 8px 22px var(--primary-glow);
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: var(--grad-main);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .app-header .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
  .app-header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ---------- Dashboard ---------- */
  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    animation: fadeUp 0.45s ease both;
    position: relative;
    box-shadow: var(--shadow-card);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 18px; right: 18px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-text), transparent);
    opacity: 0.45;
  }
  .balance-card { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .balance-label { color: var(--text-muted); font-size: 13px; font-weight: 500; }
  .balance-value {
    font-size: 42px;
    font-weight: 700;
    background: var(--grad-main);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
    letter-spacing: -0.02em;
    filter: drop-shadow(0 0 14px var(--glow-soft));
  }
  .balance-value span {
    font-size: 15px;
    color: var(--text-muted);
    -webkit-text-fill-color: var(--text-muted);
    font-weight: 500;
    margin-left: 6px;
  }
  .balance-meta { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .balance-meta strong { color: var(--text); font-weight: 600; }
  .balance-meta .tag-ot { color: var(--accent-text); }
  .balance-meta .tag-annual { color: var(--success); }
  .balance-meta .tag-other { color: var(--neutral); }
  .balance-meta .tag-expiring { color: var(--warning); font-weight: 600; }

  .expiry-card .card-title {
    font-size: 12.5px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .expiry-list { display: flex; flex-direction: column; gap: 8px; }
  .expiry-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 10px 14px; border-radius: 10px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--warning);
  }
  .expiry-item.urgent { border-left-color: var(--danger); }
  .expiry-item-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .expiry-date { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .expiry-detail { font-size: 12px; color: var(--text-muted); }
  .expiry-type-badge {
    display: inline-block; padding: 1px 7px; border-radius: 8px;
    font-size: 11px; font-weight: 500; margin-right: 6px;
  }
  .expiry-type-badge.overtime { background: var(--primary-light); color: var(--accent-text); }
  .expiry-type-badge.annual { background: var(--success-light); color: var(--success); }
  .expiry-type-badge.other { background: var(--neutral-light); color: var(--neutral); }
  .expiry-countdown { font-size: 12px; font-weight: 600; color: var(--warning); white-space: nowrap; }
  .expiry-countdown.urgent { color: var(--danger); }
  .empty-hint { color: var(--text-muted); font-size: 13px; text-align: center; padding: 16px 0; }

  /* ---------- Tabs (pill) ---------- */
  .tabs {
    display: inline-flex;
    gap: 4px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .tab {
    background: none; border: none; padding: 9px 20px;
    font-size: 13.5px; color: var(--text-muted); cursor: pointer;
    border-radius: 9px;
    transition: background 0.18s, color 0.18s, box-shadow 0.2s;
    font-family: inherit;
    font-weight: 500;
  }
  .tab:hover { color: var(--text); background: var(--tab-hover); }
  .tab.active {
    background: var(--grad-btn);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 14px var(--primary-glow);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeUp 0.3s ease both; }
  .tab-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tab-header h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .tab-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tab-title-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  /* ---------- 视图切换分段控件 ---------- */
  .ot-view-switch {
    display: inline-flex;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
  }
  .ot-view-switch .switch-btn {
    border: none;
    background: transparent;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 7px;
    font-family: inherit;
    font-weight: 500;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .ot-view-switch .switch-btn.active {
    background: var(--primary-light);
    color: var(--accent-text);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(90, 141, 255, 0.35);
  }
  html[data-theme='light'] .ot-view-switch .switch-btn.active {
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.35);
  }

  /* ---------- 加班日历 ---------- */
  .ot-calendar-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    animation: fadeUp 0.45s ease both;
    box-shadow: var(--shadow-card);
  }
  .cal-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .cal-title { font-size: 15.5px; font-weight: 650; min-width: 112px; text-align: center; letter-spacing: 0.02em; }
  .cal-nav {
    padding: 5px 13px;
    border: 1px solid var(--border);
    background: var(--card-2);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
    font-family: inherit;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .cal-nav:hover { background: var(--primary-light); color: var(--accent-text); }
  .cal-today-btn { margin-left: auto; }
  .cal-today-btn:hover { box-shadow: 0 0 12px var(--glow-soft); color: var(--accent-text); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .cal-weekday {
    padding: 9px 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--card-2);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .cal-weekday:nth-child(7n) { border-right: none; }
  .cal-cell {
    min-height: 78px;
    padding: 7px 4px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    background: transparent;
    transition: background 0.12s;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell:nth-last-child(-n+7) { border-bottom: none; }
  .cal-cell:hover { background: var(--primary-light); }
  .cal-cell.other-month { background: var(--card-2); cursor: default; opacity: 0.6; }
  .cal-cell.other-month:hover { background: var(--card-2); }
  .cal-day-num {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    width: 25px; height: 25px;
    line-height: 25px;
    margin: 0 auto;
    border-radius: 50%;
  }
  .cal-cell.weekend .cal-day-num { color: var(--accent-text); }
  .cal-cell.other-month .cal-day-num { color: var(--neutral); opacity: 0.55; }
  .cal-cell.today .cal-day-num {
    background: var(--grad-btn);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 12px var(--primary-glow);
  }
  .cal-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    margin: 6px auto 0;
  }
  .cal-dot.lv1 { background: var(--ot-lv1); box-shadow: 0 0 6px rgba(253, 164, 175, 0.5); }
  .cal-dot.lv2 { background: var(--ot-lv2); box-shadow: 0 0 7px rgba(251, 113, 133, 0.5); }
  .cal-dot.lv3 { background: var(--ot-lv3); box-shadow: 0 0 8px rgba(244, 63, 94, 0.5); }
  .cal-dot.lv4 { background: var(--ot-lv4); box-shadow: 0 0 9px rgba(225, 29, 72, 0.6); }

  /* ---------- 日历 tooltip ---------- */
  .cal-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--tooltip-bg);
    color: var(--tooltip-text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.7;
    white-space: nowrap;
    z-index: 50;
    box-shadow: var(--shadow-pop);
    pointer-events: none;
    text-align: left;
  }
  .cal-tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--tooltip-bg);
  }
  .cal-tip.tip-right { left: auto; right: -4px; transform: none; }
  .cal-tip.tip-right::after { left: auto; right: 18px; transform: none; }
  .cal-cell:hover .cal-tip { display: block; }
  .cal-tip-title { font-weight: 650; margin-bottom: 2px; color: var(--accent-text); }
  .cal-tip-row { color: var(--tooltip-text); }
  .cal-tip-note { color: var(--tooltip-sub); font-size: 11px; }
  .cal-tip-total {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
    color: var(--ot-lv3);
    font-weight: 600;
  }

  /* ---------- 日历图例 ---------- */
  .cal-legend {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .cal-legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend .cal-dot { margin: 0; width: 8px; height: 8px; }
  .cal-legend-hint { margin-left: auto; }

  /* ---------- Buttons ---------- */
  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--text);
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.2s, filter 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: var(--primary-light); border-color: rgba(90, 141, 255, 0.35); color: var(--accent-text); }
  .btn.primary {
    background: var(--grad-btn);
    border: none;
    color: #fff;
    box-shadow: 0 4px 16px var(--primary-glow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .btn.primary:hover {
    filter: brightness(1.12);
    color: #fff;
    background: var(--grad-btn);
    box-shadow: 0 6px 22px var(--primary-glow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .btn.danger { color: var(--danger); border-color: var(--border); }
  .btn.danger:hover { background: var(--danger-light); border-color: rgba(248, 113, 113, 0.4); color: var(--danger); }
  .btn.ghost {
    background: transparent;
    border-color: transparent;
    padding: 4px 10px;
    color: var(--text-muted);
  }
  .btn.ghost:hover { background: var(--tab-hover); color: var(--text); border-color: transparent; }
  .btn.ghost.danger:hover { color: var(--danger); background: var(--danger-light); }

  /* 主题切换按钮 */
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    min-width: 84px; justify-content: center;
  }

  /* ---------- Table ---------- */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.45s ease both;
    box-shadow: var(--shadow-card);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; font-size: 13px; vertical-align: middle; }
  th {
    background: var(--card-2);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  tbody tr + tr { border-top: 1px solid var(--border); }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover { background: var(--row-hover); }
  .col-time, .col-duration, .col-expires, .col-status, .col-type, .col-actions { white-space: nowrap; }
  .col-actions { text-align: right; }
  .type-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .type-badge.overtime { background: var(--primary-light); color: var(--accent-text); border-color: rgba(90, 141, 255, 0.3); }
  .type-badge.annual { background: var(--success-light); color: var(--success); border-color: rgba(52, 211, 153, 0.3); }
  .type-badge.other { background: var(--neutral-light); color: var(--neutral); border-color: var(--border); }
  html[data-theme='light'] .type-badge.overtime { border-color: rgba(37, 99, 235, 0.3); }
  html[data-theme='light'] .type-badge.annual { border-color: rgba(22, 163, 74, 0.3); }

  /* ---------- Status badges ---------- */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .badge.available { background: var(--success-light); color: var(--success); border-color: rgba(52, 211, 153, 0.3); }
  .badge.expiring { background: var(--warning-light); color: var(--warning); border-color: rgba(251, 191, 36, 0.3); }
  .badge.expired { background: var(--danger-light); color: var(--danger); border-color: rgba(248, 113, 113, 0.3); }
  .badge.exhausted { background: var(--neutral-light); color: var(--neutral); border-color: var(--border); }
  .badge.invalid { background: var(--neutral-light); color: var(--neutral); border-color: var(--border); }
  html[data-theme='light'] .badge.available { border-color: rgba(22, 163, 74, 0.3); }
  html[data-theme='light'] .badge.expiring { border-color: rgba(217, 119, 6, 0.3); }
  html[data-theme='light'] .badge.expired { border-color: rgba(220, 38, 38, 0.3); }

  /* ---------- Donut chart ---------- */
  .pool-overview {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    background: var(--card);
    border: 1px solid var(--border);

<script>
(function() {
  'use strict';

  // ---------- 工具 ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() { return formatDate(new Date()); }
  function nowTimeStr() { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function parseDateStr(s) {
    if (s instanceof Date) return new Date(s);
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function formatDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function endOfYearStr(d) {
    const ref = d ? new Date(d) : new Date();
    return ref.getFullYear() + '-12-31';
  }
  function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
  function startOfDay(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); return r; }
  function daysBetween(a, b) {
    const aT = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
    const bT = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
    return Math.floor((bT - aT) / 86400000);
  }
  function parseTimeToMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
  function formatHours(minutes) { return (minutes / 60).toFixed(1); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function weekdayCN(dateStr) { return ['日','一','二','三','四','五','六'][parseDateStr(dateStr).getDay()]; }
  function typeLabel(t) { return ({ overtime: '加班调休', annual: '年假', other: '其他' })[t] || t; }

  const OT_START_MIN = 18 * 60 + 30;
  const MIN_VALID_MINUTES = 30;

  function computeOvertimeRawMinutes(start, end) {
    const s = parseTimeToMin(start);
    const e = parseTimeToMin(end);
    if (e < s) return 0;
    const effectiveStart = Math.max(s, OT_START_MIN);
    return Math.max(0, e - effectiveStart);
  }
  function computeOvertimeMinutes(start, end) {
    return Math.floor(computeOvertimeRawMinutes(start, end) / 30) * 30;
  }
  function getExpireDate(otDate) { return addMonths(parseDateStr(otDate), 2); }

  // ---------- 数据层（按账号隔离） ----------
  const LS_KEY_USERS = 'vision-work:users';
  const LS_KEY_SESSION = 'vision-work:session';
  // 旧版本（口令版）使用的全局数据键，仅用于一次性迁移
  const LS_KEY_OT = 'vision-work:overtime';
  const LS_KEY_CP = 'vision-work:compensatory';
  const LS_KEY_LQ = 'vision-work:leave-quota';
  const LEGACY_KEYS = { overtime: LS_KEY_OT, compensatory: LS_KEY_CP, leaveQuota: LS_KEY_LQ };

  function loadUsers() {
    try { return JSON.parse(localStorage.getItem(LS_KEY_USERS) || '[]'); }
    catch(e) { return []; }
  }
  function saveUsers(users) { localStorage.setItem(LS_KEY_USERS, JSON.stringify(users)); }
  function findUser(account) { return loadUsers().find(u => u.account === account); }
  function getCurrentAccount() {
    try { return localStorage.getItem(LS_KEY_SESSION) || ''; }
    catch(e) { return ''; }
  }
  function setCurrentAccount(account) {
    try { localStorage.setItem(LS_KEY_SESSION, account); } catch(e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(LS_KEY_SESSION); } catch(e) {}
  }
  function dataKey(account, kind) { return 'vision-work:d:' + account + ':' + kind; }

  function loadData(kind) {
    const account = getCurrentAccount();
    if (!account) return [];
    try { return JSON.parse(localStorage.getItem(dataKey(account, kind)) || '[]'); }
    catch(e) { return []; }
  }
  function saveData(kind, list) {
    const account = getCurrentAccount();
    if (!account) return;
    localStorage.setItem(dataKey(account, kind), JSON.stringify(list));
  }
  function loadOvertime() { return loadData('overtime'); }
  function saveOvertime(list) { saveData('overtime', list); }
  function loadCompensatory() { return loadData('compensatory'); }
  function saveCompensatory(list) { saveData('compensatory', list); }
  function loadLeaveQuota() { return loadData('leaveQuota'); }
  function saveLeaveQuota(list) { saveData('leaveQuota', list); }

  // ---------- 数据迁移 ----------
  function migrateOvertime() {
    const list = loadOvertime();
    let dirty = false;
    for (const ot of list) {
      const recomputed = computeOvertimeMinutes(ot.start, ot.end);
      if (ot.minutes !== recomputed) {
        ot.minutes = recomputed;
        dirty = true;
      }
    }
    if (dirty) saveOvertime(list);
  }
  function migrateConsumedSourceType() {
    const list = loadCompensatory();
    let dirty = false;
    for (const cp of list) {
      if (!cp.consumed) continue;
      for (const c of cp.consumed) {
        if (!c.sourceType) { c.sourceType = 'overtime'; dirty = true; }
        if (!c.sourceId && c.overtimeId) { c.sourceId = c.overtimeId; delete c.overtimeId; dirty = true; }
      }
    }
    if (dirty) saveCompensatory(list);
  }
  function migrateData() {
    migrateOvertime();
    migrateConsumedSourceType();
  }

  // ---------- 池子计算 ----------
  function getConsumedBySource(sourceType, sourceId, excludeCpId) {
    const list = loadCompensatory();
    let total = 0;
    for (const cp of list) {
      if (excludeCpId && cp.id === excludeCpId) continue;
      if (!cp.consumed) continue;
      for (const c of cp.consumed) {
        const st = c.sourceType || 'overtime';
        const sid = c.sourceId || c.overtimeId;
        if (st === sourceType && sid === sourceId) total += c.minutes;
      }
    }
    return total;
  }

  function computePoolStatus(totalMinutes, availableMinutes, daysLeft) {
    if (totalMinutes === 0) return 'invalid';
    if (availableMinutes === 0) return daysLeft < 0 ? 'expired' : 'exhausted';
    if (daysLeft < 0) return 'expired';
    if (daysLeft <= 14) return 'expiring';
    return 'available';
  }

  function getOvertimePool(ot, excludeCpId) {
    const consumedMinutes = getConsumedBySource('overtime', ot.id, excludeCpId);
    const totalMinutes = ot.minutes;
    const availableMinutes = Math.max(0, totalMinutes - consumedMinutes);
    const expiresAt = getExpireDate(ot.date);
    const today = startOfDay(new Date());
    const daysLeft = daysBetween(today, new Date(expiresAt));
    return {
      id: ot.id, type: 'overtime', date: ot.date, expiresAt,
      totalMinutes, consumedMinutes, availableMinutes,
      status: computePoolStatus(totalMinutes, availableMinutes, daysLeft),
      daysLeft, source: ot
    };
  }

  function getLeaveQuotaPool(lq, excludeCpId) {
    const consumedMinutes = getConsumedBySource(lq.type, lq.id, excludeCpId);
    const totalMinutes = Math.round((lq.hours || 0) * 60);
    const availableMinutes = Math.max(0, totalMinutes - consumedMinutes);
    const expiresAt = parseDateStr(lq.expiresAt);
    const today = startOfDay(new Date());
    const daysLeft = daysBetween(today, new Date(expiresAt));
    return {
      id: lq.id, type: lq.type, date: lq.date, expiresAt,
      totalMinutes, consumedMinutes, availableMinutes,
      status: computePoolStatus(totalMinutes, availableMinutes, daysLeft),
      daysLeft, source: lq
    };
  }

  function getAllPools(excludeCpId) {
    const otPools = loadOvertime().map(ot => getOvertimePool(ot, excludeCpId));
    const lqPools = loadLeaveQuota().map(lq => getLeaveQuotaPool(lq, excludeCpId));
    return [...otPools, ...lqPools];
  }

  function getAvailableTotal(excludeCpId) {
    return getAllPools(excludeCpId)
      .filter(p => p.availableMinutes > 0 && p.status !== 'expired')
      .reduce((s, p) => s + p.availableMinutes, 0);
  }

  function getAvailableByType(excludeCpId) {
    const result = { overtime: 0, annual: 0, other: 0 };
    for (const p of getAllPools(excludeCpId)) {
      if (p.availableMinutes > 0 && p.status !== 'expired') {
        result[p.type] = (result[p.type] || 0) + p.availableMinutes;
      }
    }
    return result;
  }

  function consumeByFifo(minutes, excludeCpId) {
    const pools = getAllPools(excludeCpId)
      .filter(p => p.availableMinutes > 0 && p.status !== 'expired')
      .sort((a, b) => (a.expiresAt - b.expiresAt) || (new Date(a.date) - new Date(b.date)));
    const availableTotal = pools.reduce((s, p) => s + p.availableMinutes, 0);
    if (availableTotal < minutes) {
      throw new Error('可用假期不足，当前仅 ' + formatHours(availableTotal) + ' 小时');
    }
    const consumed = [];
    let need = minutes;
    for (const p of pools) {
      if (need <= 0) break;
      const take = Math.min(p.availableMinutes, need);
      consumed.push({ sourceType: p.type, sourceId: p.id, minutes: take });
      need -= take;
    }
    return consumed;
  }

  function consumeFromPool(sourceType, sourceId, minutes, excludeCpId) {
    const pool = getAllPools(excludeCpId).find(p => p.type === sourceType && p.id === sourceId);
    if (!pool) throw new Error('未找到指定的扣减来源');
    if (pool.status === 'expired' || pool.availableMinutes <= 0) {
      throw new Error(typeLabel(sourceType) + ' 该笔已无可用额度');
    }
    if (pool.availableMinutes < minutes) {
      throw new Error(typeLabel(sourceType) + ' 该笔仅剩 ' + formatHours(pool.availableMinutes) + ' 小时，不足以扣减 ' + formatHours(minutes) + ' 小时');
    }
    return [{ sourceType, sourceId, minutes }];
  }

  // ---------- 加班 CRUD ----------
  function createOvertime({ date, start, end, note }) {
    const minutes = computeOvertimeMinutes(start, end);
    const ot = { id: uid(), date, start, end, minutes, note, createdAt: new Date().toISOString() };
    const list = loadOvertime();
    list.push(ot);
    saveOvertime(list);
    return ot;
  }
  function updateOvertime(id, patch) {
    const list = loadOvertime();
    const i = list.findIndex(x => x.id === id);
    if (i < 0) throw new Error('加班记录不存在');
    const merged = { ...list[i], ...patch };
    if (patch.start || patch.end) {
      merged.minutes = computeOvertimeMinutes(merged.start, merged.end);
    }
    const consumed = getConsumedBySource('overtime', id);
    if (merged.minutes < consumed) {
      throw new Error('新的加班时长 ' + formatHours(merged.minutes) + 'h 不足以覆盖已消耗的 ' + formatHours(consumed) + 'h 调休，请先删除相关调休或调整时间');
    }
    list[i] = merged;
    saveOvertime(list);
  }
  function deleteOvertimeCascade(id) {
    const cps = loadCompensatory();
    const remaining = cps.filter(cp => !(cp.consumed && cp.consumed.some(c => (c.sourceType || 'overtime') === 'overtime' && (c.sourceId || c.overtimeId) === id)));
    saveCompensatory(remaining);
    saveOvertime(loadOvertime().filter(x => x.id !== id));
  }

  // ---------- 年假 CRUD ----------
  function createLeaveQuota({ type, date, hours, expiresAt, note }) {
    const lq = { id: uid(), type: type || 'annual', date, hours, expiresAt, note, createdAt: new Date().toISOString() };
    const list = loadLeaveQuota();
    list.push(lq);
    saveLeaveQuota(list);
    return lq;
  }
  function updateLeaveQuota(id, patch) {
    const list = loadLeaveQuota();
    const i = list.findIndex(x => x.id === id);
    if (i < 0) throw new Error('年假记录不存在');
    const old = list[i];
    const merged = { ...old, ...patch };
    const newType = merged.type;
    const consumed = getConsumedBySource(newType, id);
    const newTotalMin = Math.round((merged.hours || 0) * 60);
    if (newTotalMin < consumed) {
      throw new Error('新的额度 ' + formatHours(newTotalMin) + 'h 不足以覆盖已消耗的 ' + formatHours(consumed) + 'h，请先删除相关调休或调整额度');
    }
    list[i] = merged;
    saveLeaveQuota(list);
  }
  function deleteLeaveQuotaCascade(id) {
    const target = loadLeaveQuota().find(x => x.id === id);
    if (!target) return;
    const cps = loadCompensatory();
    const remaining = cps.filter(cp => !(cp.consumed && cp.consumed.some(c => (c.sourceType || 'overtime') === target.type && (c.sourceId || c.overtimeId) === id)));
    saveCompensatory(remaining);
    saveLeaveQuota(loadLeaveQuota().filter(x => x.id !== id));
  }

  // ---------- 调休 CRUD ----------
  function createCompensatory({ date, hours, note, source }) {
    const minutes = Math.round(hours * 60);
    let consumed;
    if (source && source !== 'fifo') {
      const [type, id] = source.split(':');
      consumed = consumeFromPool(type, id, minutes);
    } else {
      consumed = consumeByFifo(minutes);
    }
    const cp = {
      id: uid(), date, hours, minutes, note, consumed, source: source || 'fifo',
      createdAt: new Date().toISOString()
    };
    const list = loadCompensatory();
    list.push(cp);
    saveCompensatory(list);
    return cp;
  }
  function updateCompensatory(id, patch) {
    const list = loadCompensatory();
    const i = list.findIndex(x => x.id === id);
    if (i < 0) throw new Error('调休记录不存在');
    const old = list[i];
    const newHours = patch.hours != null ? patch.hours : old.hours;
    const newMinutes = Math.round(newHours * 60);
    const newSource = patch.source != null ? patch.source : (old.source || 'fifo');
    let newConsumed;
    if (newSource && newSource !== 'fifo') {
      const [type, sid] = newSource.split(':');
      newConsumed = consumeFromPool(type, sid, newMinutes, id);
    } else {
      newConsumed = consumeByFifo(newMinutes, id);
    }
    list[i] = { ...old, ...patch, hours: newHours, minutes: newMinutes, consumed: newConsumed, source: newSource };
    saveCompensatory(list);
  }
  function deleteCompensatory(id) {
    saveCompensatory(loadCompensatory().filter(x => x.id !== id));
  }

  // ---------- 渲染 ----------
  function statusLabel(s) {
    return ({ available: '可用', expiring: '即将过期', expired: '已过期', exhausted: '已用完', invalid: '无效' })[s] || s;
  }

  function renderAll() {
    renderDashboard();
    renderOvertimeList();
    renderOvertimeCalendar();
    renderLeaveQuotaList();
    renderCompensatoryList();
    renderPoolOverview();
    renderPoolList();
  }

  function renderDashboard() {
    const total = getAvailableTotal();
    document.getElementById('balance-value').innerHTML = formatHours(total) + ' <span>小时</span>';

    const byType = getAvailableByType();
    const pools = getAllPools();
    const validPools = pools.filter(p => p.availableMinutes > 0 && p.status !== 'expired' && p.status !== 'invalid');
    const expiringPools = validPools.filter(p => p.status === 'expiring');

    const otH = formatHours(byType.overtime);
    const anH = formatHours(byType.annual);
    const otherH = formatHours(byType.other);

    let parts = [];
    if (byType.overtime > 0) parts.push('<span class="tag-ot">调休 ' + otH + 'h</span>');
    if (byType.annual > 0) parts.push('<span class="tag-annual">年假 ' + anH + 'h</span>');
    if (byType.other > 0) parts.push('<span class="tag-other">其他 ' + otherH + 'h</span>');

    document.getElementById('balance-meta').innerHTML =
      validPools.length === 0
        ? '暂无可用假期'
        : parts.join(' · ') + ' · 共 <strong>' + validPools.length + '</strong> 笔未过期' +
          (expiringPools.length > 0 ? ' · <span class="tag-expiring">' + expiringPools.length + ' 笔即将过期</span>' : '');

    const wrap = document.getElementById('expiry-list');
    if (expiringPools.length === 0) {
      wrap.innerHTML = '<div class="empty-hint">14 天内无假期过期</div>';
    } else {
      expiringPools.sort((a, b) => (a.expiresAt - b.expiresAt) || (new Date(a.date) - new Date(b.date)));
      wrap.innerHTML = expiringPools.map(p => {
        const days = p.daysLeft;
        const urgent = days <= 7;
        return '<div class="expiry-item' + (urgent ? ' urgent' : '') + '">' +
          '<div class="expiry-item-info">' +
            '<div class="expiry-date"><span class="expiry-type-badge ' + p.type + '">' + typeLabel(p.type) + '</span>' + formatDate(new Date(p.expiresAt)) + ' 过期</div>' +
            '<div class="expiry-detail">' + (p.type === 'overtime' ? '加班日 ' : '授予日 ') + p.date + ' · 剩余 ' + formatHours(p.availableMinutes) + 'h</div>' +
          '</div>' +
          '<div class="expiry-countdown' + (urgent ? ' urgent' : '') + '">' + (days === 0 ? '今天' : days + ' 天后') + '</div>' +
        '</div>';
      }).join('');
    }
  }

  function renderOvertimeList() {
    const list = loadOvertime().slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const wrap = document.getElementById('overtime-table-wrap');
    if (list.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><div class="icon">📋</div>暂无加班记录，点击右上角「新增加班」开始记录</div>';
      return;
    }
    const poolMap = Object.fromEntries(getAllPools().map(p => [p.id, p]));
    const rows = list.map(ot => {
      const p = poolMap[ot.id];
      return '<tr>' +
        '<td>' + ot.date + ' 周' + weekdayCN(ot.date) + '</td>' +
        '<td class="col-time">' + ot.start + ' – ' + ot.end + '</td>' +
        '<td class="col-duration">' + formatHours(ot.minutes) + 'h</td>' +
        '<td class="col-expires">' + formatDate(new Date(p.expiresAt)) + '</td>' +
        '<td>' + formatHours(p.availableMinutes) + 'h / ' + formatHours(p.totalMinutes) + 'h</td>' +
        '<td class="col-status"><span class="badge ' + p.status + '">' + statusLabel(p.status) + '</span></td>' +
        '<td class="col-actions">' +
          '<button class="btn ghost" data-edit-ot="' + ot.id + '">编辑</button>' +
          '<button class="btn ghost danger" data-del-ot="' + ot.id + '">删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML = '<table>' +
      '<thead><tr>' +
        '<th>日期</th><th>时段</th><th>加班</th><th>过期日</th><th>剩余/产生</th><th>状态</th><th class="col-actions">操作</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +

  }

  // ---------- 加班日历视图 ----------
  const LS_KEY_OT_VIEW = 'vision-work:ot-view';
  let otCalYear = 0, otCalMonth = 0;

  function getOvertimeViewPref() {
    try { return localStorage.getItem(LS_KEY_OT_VIEW) === 'list' ? 'list' : 'calendar'; }
    catch(e) { return 'calendar'; }
  }

  function switchOvertimeView(view) {
    const calWrap = document.getElementById('overtime-calendar-wrap');
    const listWrap = document.getElementById('overtime-table-wrap');
    if (view === 'list') {
      calWrap.classList.add('hidden');
      listWrap.classList.remove('hidden');
    } else {
      calWrap.classList.remove('hidden');
      listWrap.classList.add('hidden');
    }
    document.querySelectorAll('#ot-view-switch .switch-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.otView === view);
    });
    try { localStorage.setItem(LS_KEY_OT_VIEW, view); } catch(e) {}
  }

  function groupOvertimeByDate() {
    const map = {};
    for (const ot of loadOvertime()) {
      if (!map[ot.date]) map[ot.date] = [];
      map[ot.date].push(ot);
    }
    return map;
  }

  function dotLevel(totalMinutes) {
    if (totalMinutes <= 60) return 'lv1';
    if (totalMinutes <= 120) return 'lv2';
    if (totalMinutes <= 180) return 'lv3';
    return 'lv4';
  }

  function changeOtMonth(delta) {
    otCalMonth += delta;
    if (otCalMonth < 0) { otCalMonth = 11; otCalYear--; }
    if (otCalMonth > 11) { otCalMonth = 0; otCalYear++; }
    renderOvertimeCalendar();
  }

  function renderOvertimeCalendar() {
    const wrap = document.getElementById('overtime-calendar-wrap');
    const byDate = groupOvertimeByDate();
    const poolMap = Object.fromEntries(getAllPools().map(p => [p.id, p]));
    const todayS = todayStr();

    const first = new Date(otCalYear, otCalMonth, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(otCalYear, otCalMonth + 1, 0).getDate();
    const prevMonthDays = new Date(otCalYear, otCalMonth, 0).getDate();

    const weekdayHtml = ['日','一','二','三','四','五','六'].map(w => '<div class="cal-weekday">' + w + '</div>').join('');

    let cells = '';
    for (let i = startOffset - 1; i >= 0; i--) {
      cells += '<div class="cal-cell other-month"><div class="cal-day-num">' + (prevMonthDays - i) + '</div></div>';
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = otCalYear + '-' + pad2(otCalMonth + 1) + '-' + pad2(day);
      const dow = new Date(otCalYear, otCalMonth, day).getDay();
      const classes = ['cal-cell'];
      if (dow === 0 || dow === 6) classes.push('weekend');
      if (dateStr === todayS) classes.push('today');

      const records = byDate[dateStr] || [];
      const totalMin = records.reduce((s, r) => s + (r.minutes || 0), 0);

      let inner = '<div class="cal-day-num">' + day + '</div>';
      if (records.length > 0) {
        classes.push('has-ot');
        inner += '<div class="cal-dot ' + dotLevel(totalMin) + '"></div>';
        const rowsHtml = records.map(r => {
          const p = poolMap[r.id];
          const statusTxt = p ? ' · ' + statusLabel(p.status) : '';
          const noteTxt = r.note
            ? '<div class="cal-tip-note">' + escapeHtml(r.note.length > 24 ? r.note.slice(0, 24) + '…' : r.note) + '</div>'
            : '';
          return '<div class="cal-tip-row">' + r.start + '–' + r.end + ' · ' + formatHours(r.minutes) + 'h' + statusTxt + '</div>' + noteTxt;
        }).join('');
        const totalHtml = records.length > 1
          ? '<div class="cal-tip-total">共 ' + records.length + ' 笔 · 合计 ' + formatHours(totalMin) + 'h</div>'
          : '';
        const tipRight = dow >= 5 ? ' tip-right' : '';
        inner += '<div class="cal-tip' + tipRight + '">' +
          '<div class="cal-tip-title">' + dateStr + ' 周' + weekdayCN(dateStr) + '</div>' +
          rowsHtml + totalHtml + '</div>';
      }
      cells += '<div class="' + classes.join(' ') + '" data-cal-date="' + dateStr + '" data-cal-count="' + records.length + '">' + inner + '</div>';
    }
    const trailing = (7 - ((startOffset + daysInMonth) % 7)) % 7;
    for (let i = 1; i <= trailing; i++) {
      cells += '<div class="cal-cell other-month"><div class="cal-day-num">' + i + '</div></div>';
    }

    wrap.innerHTML =
      '<div class="cal-header">' +
        '<button type="button" class="cal-nav" id="cal-prev" title="上个月">‹</button>' +
        '<div class="cal-title">' + otCalYear + '年' + (otCalMonth + 1) + '月</div>' +
        '<button type="button" class="cal-nav" id="cal-next" title="下个月">›</button>' +
        '<button type="button" class="cal-nav cal-today-btn" id="cal-today">今天</button>' +
      '</div>' +
      '<div class="cal-grid">' + weekdayHtml + cells + '</div>' +
      '<div class="cal-legend">' +
        '<span class="cal-legend-item"><span class="cal-dot lv1"></span>≤1h</span>' +
        '<span class="cal-legend-item"><span class="cal-dot lv2"></span>1–2h</span>' +
        '<span class="cal-legend-item"><span class="cal-dot lv3"></span>2–3h</span>' +
        '<span class="cal-legend-item"><span class="cal-dot lv4"></span>&gt;3h</span>' +
        '<span class="cal-legend-hint">点击空白日期可快速新增加班</span>' +
      '</div>';
  }

    const wrap = document.getElementById('leave-quota-table-wrap');

    wrap.innerHTML = '<table>' +
      '<thead><tr>' +

      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +

  function renderCompensatoryList() {
    const list = loadCompensatory().slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const wrap = document.getElementById('compensatory-table-wrap');
    if (list.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><div class="icon">🌴</div>暂无调休记录</div>';
      return;
    }
    // 索引池子，方便查类型 + 日期
    const otMap = Object.fromEntries(loadOvertime().map(o => [o.id, o]));
    const lqMap = Object.fromEntries(loadLeaveQuota().map(l => [l.id, l]));

    const rows = list.map(cp => {
      const consumedDetail = (cp.consumed || []).map(c => {
        const st = c.sourceType || 'overtime';
        const sid = c.sourceId || c.overtimeId;
        let src;
        if (st === 'overtime') {
          const ot = otMap[sid];
          src = ot ? ('加班 ' + ot.date + ' 周' + weekdayCN(ot.date)) : '(加班已删除)';
        } else {
          const lq = lqMap[sid];
          src = lq ? (typeLabel(lq.type) + ' ' + lq.date + ' 周' + weekdayCN(lq.date)) : '(额度已删除)';
        }
        const cls = (st === 'overtime' ? otMap[sid] : lqMap[sid]) ? 'line' : 'line orphan';
        return '<span class="' + cls + '">· ' + src + ' 扣减 ' + formatHours(c.minutes) + 'h</span>';
      }).join('') || '<span class="line">（无消耗明细）</span>';

      return '<tr>' +
        '<td>' + cp.date + ' 周' + weekdayCN(cp.date) + '</td>' +
        '<td class="col-duration">' + formatHours(cp.minutes) + 'h</td>' +
        '<td><div class="consumed-detail">' + consumedDetail + '</div></td>' +
        '<td>' + escapeHtml(cp.note || '') + '</td>' +
        '<td class="col-actions">' +
          '<button class="btn ghost" data-edit-cp="' + cp.id + '">编辑</button>' +
          '<button class="btn ghost danger" data-del-cp="' + cp.id + '">删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML = '<table>' +
      '<thead><tr>' +
        '<th>日期</th><th>调休</th><th>扣减详情</th><th>备注</th><th class="col-actions">操作</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
  }

  function renderPoolOverview() {
    const wrap = document.getElementById('pool-overview-wrap');
    const byType = getAvailableByType();
    const total = byType.overtime + byType.annual + byType.other;

    if (total === 0) {
      wrap.innerHTML = '<div class="pool-overview"><div class="pool-empty-hint">暂无可用假期额度</div></div>';
      return;
    }

    const circumference = 2 * Math.PI * 70; // r=70, 周长 ≈ 439.82
    const otPct = total > 0 ? byType.overtime / total : 0;
    const annualPct = total > 0 ? byType.annual / total : 0;
    const otherPct = total > 0 ? byType.other / total : 0;
    const otLen = otPct * circumference;
    const annualLen = annualPct * circumference;
    const otherLen = otherPct * circumference;
    // dashoffset：第一段从 0 开始，后续段累加
    // SVG dasharray + dashoffset；offset 是负数往前往画
    const otOffset = 0;
    const annualOffset = -otLen;
    const otherOffset = -(otLen + annualLen);

    const legendParts = [];
    if (byType.overtime > 0) {
      legendParts.push('<div class="legend-item"><span class="legend-dot overtime"></span><span class="legend-label">加班调休</span><span class="legend-value">' + formatHours(byType.overtime) + 'h</span><span class="legend-percent">' + (otPct * 100).toFixed(1) + '%</span></div>');
    }
    if (byType.annual > 0) {
      legendParts.push('<div class="legend-item"><span class="legend-dot annual"></span><span class="legend-label">年假</span><span class="legend-value">' + formatHours(byType.annual) + 'h</span><span class="legend-percent">' + (annualPct * 100).toFixed(1) + '%</span></div>');
    }
    if (byType.other > 0) {
      legendParts.push('<div class="legend-item"><span class="legend-dot other"></span><span class="legend-label">其他</span><span class="legend-value">' + formatHours(byType.other) + 'h</span><span class="legend-percent">' + (otherPct * 100).toFixed(1) + '%</span></div>');
    }

    wrap.innerHTML = '<div class="pool-overview">' +
      '<div class="donut-wrap">' +
        '<svg viewBox="0 0 160 160">' +
          '<circle cx="80" cy="80" r="70" fill="none" style="stroke:var(--chart-track)" stroke-width="20"/>' +
          (byType.overtime > 0 ? '<circle cx="80" cy="80" r="70" fill="none" style="stroke:var(--primary)" stroke-width="20" stroke-dasharray="' + otLen + ' ' + (circumference - otLen) + '" stroke-dashoffset="' + otOffset + '"/>' : '') +
          (byType.annual > 0 ? '<circle cx="80" cy="80" r="70" fill="none" style="stroke:var(--success)" stroke-width="20" stroke-dasharray="' + annualLen + ' ' + (circumference - annualLen) + '" stroke-dashoffset="' + annualOffset + '"/>' : '') +
          (byType.other > 0 ? '<circle cx="80" cy="80" r="70" fill="none" style="stroke:var(--neutral)" stroke-width="20" stroke-dasharray="' + otherLen + ' ' + (circumference - otherLen) + '" stroke-dashoffset="' + otherOffset + '"/>' : '') +
        '</svg>' +
        '<div class="donut-center"><div class="num">' + formatHours(total) + '<span>h</span></div><div class="lbl">可用假期</div></div>' +
      '</div>' +
      '<div class="donut-legend">' + legendParts.join('') + '</div>' +
    '</div>';
  }

  // ---------- 导出 Excel ----------
  function escapeXml(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function exportTableToXls(filename, sheetName, headers, rows) {
    const thead = '<tr>' + headers.map(h => '<th>' + escapeXml(h) + '</th>').join('') + '</tr>';
    const tbody = rows.map(row =>
      '<tr>' + row.map(cell => '<td>' + (cell === '' ? '' : escapeXml(cell)) + '</td>').join('') + '</tr>'
    ).join('');
    const html =
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
      'xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="UTF-8">' +
      '<style>th{font-weight:bold;background:#f1f3f5;} ' +
      'td{vertical-align:middle;}</style></head><body>' +
      '<table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>' +
      '</body></html>';

    const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- 数据导出/导入 JSON ----------
  function exportDataJson() {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      overtime: loadOvertime(),
      compensatory: loadCompensatory(),
      leaveQuota: loadLeaveQuota()
    };
    const blob = new Blob(['﻿' + JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vision-work-data_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function isValidDataPayload(data) {
    return data && typeof data === 'object' &&
      Array.isArray(data.overtime) &&
      Array.isArray(data.compensatory) &&
      Array.isArray(data.leaveQuota);
  }

  function importDataJson(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      let data;
      try {
        data = JSON.parse(e.target.result);
      } catch (err) {
        alert('无法解析该文件：不是有效的 JSON');
        return;
      }
      if (!isValidDataPayload(data)) {
        alert('文件格式不正确：缺少 overtime / compensatory / leaveQuota 数据');
        return;
      }
      const msg =
        '导入将覆盖当前全部数据，确定继续吗？\n\n' +
        '加班记录：' + data.overtime.length + ' 笔\n' +
        '调休记录：' + data.compensatory.length + ' 笔\n' +
        '年假/额度：' + data.leaveQuota.length + ' 笔';
      showConfirm('导入数据', msg, () => {
        saveOvertime(data.overtime);
        saveCompensatory(data.compensatory);
        saveLeaveQuota(data.leaveQuota);
        migrateData();
        renderAll();
        alert('数据导入成功');
      });
    };
    reader.readAsText(file);
    event.target.value = '';
  }

      document.getElementById('overtime-start').value = ot.start;
      document.getElementById('overtime-end').value = ot.end;
      document.getElementById('overtime-note').value = ot.note || '';
    } else {

  // ---------- 账号系统（登录 / 注册，数据按账号隔离） ----------
  const DEFAULT_ACCOUNT = 'xiechangyun';
  const DEFAULT_NAME = '谢昌运';
  const DEFAULT_PASSWORD = '123456';

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function genSalt() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function hashPassword(password, salt) {
    return await sha256Hex(salt + '::' + password);
  }
  async function verifyPassword(password, user) {
    return (await hashPassword(password, user.salt)) === user.hash;
  }

  // 确保预置账号存在，并把旧版本（口令版）的全局数据迁移到该账号
  async function ensureDefaultUserAndMigrate() {
    const users = loadUsers();
    const hasLegacy = Object.keys(LEGACY_KEYS).some(k => {
      try {
        const v = localStorage.getItem(LEGACY_KEYS[k]);
        return v && v !== '[]';
      } catch(e) { return false; }
    });
    if (!users.some(u => u.account === DEFAULT_ACCOUNT)) {
      const salt = genSalt();
      const hash = await hashPassword(DEFAULT_PASSWORD, salt);
      users.push({ name: DEFAULT_NAME, account: DEFAULT_ACCOUNT, salt, hash, createdAt: new Date().toISOString(), isDefault: true });
      saveUsers(users);
    }
    if (hasLegacy) {
      for (const k of Object.keys(LEGACY_KEYS)) {
        try {
          const raw = localStorage.getItem(LEGACY_KEYS[k]);
          if (raw) localStorage.setItem(dataKey(DEFAULT_ACCOUNT, k), raw);
          localStorage.removeItem(LEGACY_KEYS[k]);
        } catch(e) {}
      }
    }
  }

  async function handleAuthSubmit() {
    const nameEl = document.getElementById('auth-name');
    const accountEl = document.getElementById('auth-account');
    const passEl = document.getElementById('auth-password');
    const name = nameEl.value.trim();
    const account = accountEl.value.trim();
    const password = passEl.value;
    const errorEl = document.getElementById('auth-error');
    errorEl.classList.add('hidden');
    if (!account) { showAuthError('请输入账号'); accountEl.focus(); return; }
    if (!password) { showAuthError('请输入密码'); passEl.focus(); return; }
    const users = loadUsers();
    const existing = users.find(u => u.account === account);
    if (existing) {
      const ok = await verifyPassword(password, existing);
      if (!ok) { showAuthError('密码错误，请重试'); passEl.value = ''; passEl.focus(); return; }
    } else {
      if (!name) { showAuthError('新账号请填写用户名'); nameEl.focus(); return; }
      const salt = genSalt();
      const hash = await hashPassword(password, salt);
      users.push({ name, account, salt, hash, createdAt: new Date().toISOString() });
      saveUsers(users);
    }
    setCurrentAccount(account);
    nameEl.value = ''; accountEl.value = ''; passEl.value = '';
    hideAuthOverlay();
  }

      }
      const cell = e.target.closest('.cal-cell');
      if (!cell || cell.classList.contains('other-month')) return;
      const dateStr = cell.dataset.calDate;
      const count = parseInt(cell.dataset.calCount, 10);
      if (count === 0) {
        openOvertimeModal(null, dateStr);
      } else if (count === 1) {
        const rec = groupOvertimeByDate()[dateStr][0];
        openOvertimeModal(rec.id);
      }
    });
    document.getElementById('leave-quota-table-wrap').addEventListener('click', e => {
      const t = e.target;
      if (t.dataset.editLq) openLeaveQuotaModal(t.dataset.editLq);
      else if (t.dataset.delLq) confirmDeleteLeaveQuota(t.dataset.delLq);
    });
    document.getElementById('compensatory-table-wrap').addEventListener('click', e => {
      const t = e.target;
      if (t.dataset.editCp) openCompensatoryModal(t.dataset.editCp);
      else if (t.dataset.delCp) confirmDeleteCompensatory(t.dataset.delCp);
    });

    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); }));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.modal:not(.hidden)').forEach(m => m.classList.add('hidden'));
    });
  }

  // ---------- 风格模式切换 ----------
  const LS_KEY_THEME = 'vision-work:theme';
  function getThemePref() {
    try {
      const t = localStorage.getItem(LS_KEY_THEME);
      return (t === 'light' || t === 'dark') ? t : 'dark';
    } catch (e) { return 'dark'; }
  }
  function updateThemeButtons() {
    const dark = getThemePref() === 'dark';
    const b1 = document.getElementById('btn-theme-toggle');
    const b2 = document.getElementById('btn-auth-theme-toggle');
    if (b1) b1.textContent = dark ? '🌙 深色' : '☀️ 浅色';
    if (b2) b2.textContent = dark ? '🌙' : '☀️';
  }
  function toggleTheme() {
    const next = getThemePref() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(LS_KEY_THEME, next); } catch (e) {}
    document.documentElement.setAttribute('data-theme', next);
    updateThemeButtons();
  }
  function bindThemeEvents() {
    const b1 = document.getElementById('btn-theme-toggle');
    const b2 = document.getElementById('btn-auth-theme-toggle');
    if (b1) b1.addEventListener('click', toggleTheme);
    if (b2) b2.addEventListener('click', toggleTheme);
  }

  // ---------- 初始化 ----------
  bindEvents();
  bindAuthEvents();
  bindThemeEvents();
  updateThemeButtons();
  (async function init() {
    await ensureDefaultUserAndMigrate();
    const _initNow = new Date();
    otCalYear = _initNow.getFullYear();
    otCalMonth = _initNow.getMonth();
    switchOvertimeView(getOvertimeViewPref());
    if (getCurrentAccount() && findUser(getCurrentAccount())) {
      migrateData();
      hideAuthOverlay();
    } else {
      showAuthOverlay();
    }
  })();
})();
</script>
</body>
</html>
